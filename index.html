    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🗺️</span>
        <span class="font-bold text-lg">Awastha — Peta Kerusakan</span>

  <!-- PAGE: MAP -->
  <div id="page-map" class="page-content">
    <div class="max-w-7xl mx-auto p-4">
      <h2 class="text-xl font-bold mb-2">Peta Sebaran Kerusakan</h2>
      <div id="map" style="height: 70vh; border-radius: 0.5rem; overflow: hidden;"></div>
      <div id="legend" class="mt-4 flex flex-wrap gap-3 items-center text-sm"></div>
      <div id="map-info" class="mt-2 text-gray-400 text-sm"></div>
    </div>
  </div>

  <!-- PAGE: FORM -->
  <div id="page-form" class="page-content hidden">
    <div class="max-w-2xl mx-auto p-4">
      <h2 class="text-xl font-bold mb-4">Laporkan Kerusakan</h2>
      <form id="report-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">ID Relawan *</label>
          <input type="text" id="idRelawan" required class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700 focus:border-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Nama Desa *</label>
          <select id="idDesa" required class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700 focus:border-blue-500 outline-none">
            <option value="">-- Pilih Desa --</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Kategori Infrastruktur *</label>
            <select id="kategoriInfra" required class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700">
              <option value="Rumah">Rumah</option>
              <option value="Faskes">Faskes</option>
              <option value="Sekolah">Sekolah</option>
              <option value="Ibadah">Ibadah</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Tingkat Kerusakan *</label>
            <select id="tingkatKerusakan" required class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700">
              <option value="Ringan">Ringan</option>
              <option value="Sedang">Sedang</option>
              <option value="Berat">Berat</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Latitude *</label>
            <input type="number" id="latitude" step="0.000001" required readonly class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Longitude *</label>
            <input type="number" id="longitude" step="0.000001" required readonly class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700">
          </div>
        </div>
        <button type="button" onclick="captureGPS()" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 rounded text-sm font-medium">📍 Capture GPS</button>
        <span id="gps-status" class="text-sm text-gray-400 ml-2"></span>
        <div>
          <label class="block text-sm font-medium mb-1">Foto Bukti (max 500KB)</label>
          <input type="file" id="fotoBukti" accept="image/*" class="w-full text-sm">
          <canvas id="compressCanvas" style="display:none;"></canvas>
          <img id="fotoPreview" class="mt-2 max-w-xs rounded hidden">
        </div>
        <button type="submit" class="w-full px-4 py-2 bg-green-600 hover:bg-green-700 rounded font-bold">Kirim Laporan</button>
      </form>
      <div id="form-result" class="mt-4"></div>
    </div>
  </div>

  <!-- PAGE: ADMIN -->
  <div id="page-admin" class="page-content hidden">
    <!-- LOGIN MODAL -->
    <div id="admin-login" class="max-w-md mx-auto mt-20 p-6 bg-gray-800 rounded-lg shadow-xl">
      <h2 class="text-xl font-bold mb-4 text-center">Login Admin</h2>
      <form id="admin-login-form" class="space-y-3">
        <input type="text" id="adminUsername" placeholder="Username" required class="w-full px-3 py-2 rounded bg-gray-700 border border-gray-600 outline-none focus:border-purple-500">

        <button type="submit" class="w-full px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded font-bold">Login</button>

      <div id="login-error" class="mt-3 text-red-400 text-sm text-center"></div>

    <!-- DASHBOARD -->
    <div id="admin-dashboard" class="hidden">
      <div class="max-w-7xl mx-auto p-4">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold">Dashboard Moderasi</h2>
          <button onclick="adminLogout()" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 rounded text-sm">Logout</button>
        </div>
        <div id="admin-info" class="text-sm text-gray-400 mb-4"></div>
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-gray-800 text-left">
              <th class="p-2">Foto</th>
              <th class="p-2">Waktu</th>
              <th class="p-2">Desa</th>
              <th class="p-2">Kategori</th>
              <th class="p-2">Kerusakan</th>
              <th class="p-2">Koordinat</th>
              <th class="p-2">Status</th>
              <th class="p-2">Aksi</th>
            </tr>
          </thead>
          <tbody id="reports-body"></tbody>
        </table>
      </div>
    </div>
  </div>
