  <script type="text/javascript">
// ============================================================
// AWASTHA FRONTEND - WebGIS + Form + Admin Dashboard
// ============================================================

// ---------- GLOBAL STATE ----------
let map = null;
let choroplethLayer = null;
let desaGeoJSON = null;
let choroplethData = [];
let adminToken = sessionStorage.getItem('adminToken') || null;
let adminUser = null;

// ---------- PAGE ROUTING ----------
function showPage(pageId) {
  // Hide all pages
  document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
  // Show selected
  document.getElementById('page-' + pageId).classList.remove('hidden');
  
  // Update nav buttons style
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.className = "nav-btn px-4 py-2 rounded-md text-xs font-semibold uppercase tracking-wider transition-all duration-200 text-gray-400 hover:text-white";
  });
  
  const activeBtn = document.querySelector(`button[onclick="showPage('${pageId}')"]`);
  if (activeBtn) {
    if (pageId === 'map') {
      activeBtn.className = "nav-btn px-4 py-2 rounded-md text-xs font-semibold uppercase tracking-wider transition-all duration-200 bg-blue-600 text-white shadow-sm";
    } else if (pageId === 'form') {
      activeBtn.className = "nav-btn px-4 py-2 rounded-md text-xs font-semibold uppercase tracking-wider transition-all duration-200 bg-green-600 text-white shadow-sm";
    } else if (pageId === 'admin') {
      activeBtn.className = "nav-btn px-4 py-2 rounded-md text-xs font-semibold uppercase tracking-wider transition-all duration-200 bg-purple-600 text-white shadow-sm";
    }
  }
  
  if (pageId === 'map') {
    initMap();
    loadChoroplethData();
  } else if (pageId === 'form') {
    loadDesaList();
  } else if (pageId === 'admin') {
    checkAdminSession();
  }
}

// ---------- INIT ----------
document.addEventListener('DOMContentLoaded', () => {
  showPage('map'); // default
  
  // Form submit handler
  document.getElementById('report-form').addEventListener('submit', handleReportSubmit);
  
  // Admin login form
  document.getElementById('admin-login-form').addEventListener('submit', handleAdminLogin);
  
  // File input preview & compress
  document.getElementById('fotoBukti').addEventListener('change', handleFileSelect);
});

// ---------- GOOGLE SCRIPT RUN WRAPPERS ----------
function runServer(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fnName](...args);
  });
}

// ---------- MAP / CHOROPLETH ----------
async function initMap() {
  if (map) return;
  
  map = L.map('map', {
    center: [-8.657, 121.079], // NTT center
    zoom: 8,
    zoomControl: true
  });
  
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>, &copy; OpenStreetMap',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);
  
  // Load GeoJSON (embedded or fetch)
  await loadDesaGeoJSON();
}

async function loadDesaGeoJSON() {
  try {
    // Try to load from local file first (clasp pushes all files)
    // Fallback: embedded in JS below
    const res = await fetch('desa.geojson');
    if (res.ok) {
      desaGeoJSON = await res.json();
      return;
    }
  } catch (e) {
    console.warn('GeoJSON file not found, using embedded sample');
  }
  
  // Fallback: minimal sample - user should replace with real data
  desaGeoJSON = {
    type: 'FeatureCollection',
    features: [
      { type: 'Feature', properties: { ID_Desa: '53.01.01.2001', Nama_Desa: 'Desa Sample 1' }, geometry: { type: 'Polygon', coordinates: [[[121.0, -8.5], [121.1, -8.5], [121.1, -8.6], [121.0, -8.6], [121.0, -8.5]]] } },
      { type: 'Feature', properties: { ID_Desa: '53.01.01.2002', Nama_Desa: 'Desa Sample 2' }, geometry: { type: 'Polygon', coordinates: [[[121.2, -8.5], [121.3, -8.5], [121.3, -8.6], [121.2, -8.6], [121.2, -8.5]]] } }
    ]
  };
}

async function loadChoroplethData() {
  document.getElementById('map-info').textContent = 'Memuat data...';
  
  try {
    const result = await runServer('getChoroplethData');
    choroplethData = result || [];
    renderChoropleth();
    updateStatSummary();
    document.getElementById('map-info').textContent = `Diperbarui: ${new Date().toLocaleTimeString('id-ID')} | ${choroplethData.length} desa`;
  } catch (err) {
    document.getElementById('map-info').textContent = 'Error: ' + err.message;
  }
}

function updateStatSummary() {
  let totalBangunan = 0;
  let totalLaporan = 0;
  let weightedDamageSum = 0;
  let totalLaporanValid = 0;

  choroplethData.forEach(d => {
    totalBangunan += parseInt(d.Total_Bangunan || 0);
    totalLaporan += parseInt(d.Total_Laporan_Valid || 0);
    weightedDamageSum += parseFloat(d.Skor_Damage || 0);
    if (parseFloat(d.Skor_Damage || 0) > 0) {
      totalLaporanValid++;
    }
  });

  const avgDamage = totalLaporanValid > 0 ? (weightedDamageSum / totalLaporanValid).toFixed(2) : '0.00';

  document.getElementById('stat-total-bangunan').textContent = totalBangunan.toLocaleString('id-ID');
  document.getElementById('stat-total-laporan').textContent = totalLaporan.toLocaleString('id-ID');
  document.getElementById('stat-average-damage').textContent = avgDamage + '%';
}

function renderChoropleth() {
  if (!desaGeoJSON || !map) return;
  
  // Remove old layer
  if (choroplethLayer) map.removeLayer(choroplethLayer);
  
  // Build lookup map
  const dataMap = {};
  choroplethData.forEach(d => {
    dataMap[d.ID_Desa] = d;
  });
  
  choroplethLayer = L.geoJSON(desaGeoJSON, {
    style: feature => {
      const d = dataMap[feature.properties.ID_Desa];
      if (!d) return { fillColor: '#374151', weight: 1, opacity: 1, color: '#4b5563', fillOpacity: 0.5 };
      return {
        fillColor: d.Warna_Hex,
        weight: 1.5,
        opacity: 1,
        color: '#fff',
        fillOpacity: 0.7
      };
    },
    onEachFeature: (feature, layer) => {
      const d = dataMap[feature.properties.ID_Desa];
      const nama = feature.properties.Nama_Desa || 'Unknown';
      if (d) {
        layer.bindPopup(`
          <strong>${nama}</strong><br>
          Skor Kerusakan: <span style="color:${d.Warna_Hex}">${d.Skor_Damage}%</span><br>
          Laporan Valid: ${d.Total_Laporan_Valid}<br>
          Berat: ${d.Rusak_Berat} | Sedang: ${d.Rusak_Sedang} | Ringan: ${d.Rusak_Ringan}<br>
          Total Bangunan: ${d.Total_Bangunan}
        `);
      } else {
        layer.bindPopup(`<strong>${nama}</strong><br>Belum ada data laporan valid`);
      }
    }
  }).addTo(map);
  
  // Fit bounds
  if (choroplethLayer.getBounds().isValid()) {
    map.fitBounds(choroplethLayer.getBounds(), { padding: [20, 20] });
  }
  
  renderLegend();
}

function renderLegend() {
  const container = document.getElementById('legend');
  container.innerHTML = '';
  
  const tiers = [
    { label: 'Sangat Rendah (0-10%)', color: '#2ecc71' },
    { label: 'Rendah (10-30%)', color: '#f1c40f' },
    { label: 'Sedang (30-50%)', color: '#e67e22' },
    { label: 'Tinggi (50-75%)', color: '#e74c3c' },
    { label: 'Kritis (>75%)', color: '#78281f' },
    { label: 'Tidak Ada Data', color: '#374151' }
  ];
  
  tiers.forEach(t => {
    const div = document.createElement('div');
    div.className = 'flex items-center';
    div.innerHTML = `<span class="legend-swatch" style="background:${t.color}"></span>${t.label}`;
    container.appendChild(div);
  });
}

// ---------- FORM ----------
async function loadDesaList() {
  try {
    const result = await runServer('getDesaList');
    const select = document.getElementById('idDesa');
    select.innerHTML = '<option value="">-- Pilih Desa --</option>';
    
    if (result.success && result.desaList) {
      result.desaList.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.ID_Desa;
        opt.textContent = `${d.Nama_Desa} (${d.ID_Desa})`;
        select.appendChild(opt);
      });
    }
  } catch (err) {
    console.error('loadDesaList error:', err);
  }
}

function captureGPS() {
  const statusEl = document.getElementById('gps-status');
  statusEl.textContent = 'Mencari lokasi...';
  statusEl.className = 'text-sm text-yellow-400 ml-2';
  
  if (!navigator.geolocation) {
    statusEl.textContent = 'Geolocation tidak didukung browser ini';
    statusEl.className = 'text-sm text-red-400 ml-2';
    return;
  }
  
  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('latitude').value = pos.coords.latitude.toFixed(6);
      document.getElementById('longitude').value = pos.coords.longitude.toFixed(6);
      statusEl.textContent = `Akurasi: ±${Math.round(pos.coords.accuracy)}m`;
      statusEl.className = 'text-sm text-green-400 ml-2';
    },
    err => {
      statusEl.textContent = 'Gagal: ' + err.message;
      statusEl.className = 'text-sm text-red-400 ml-2';
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const canvas = document.getElementById('compressCanvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  
  img.onload = () => {
    // Calculate new dimensions (max 1280px)
    const MAX_DIM = 1280;
    let { width, height } = img;
    if (width > MAX_DIM || height > MAX_DIM) {
      if (width > height) {
        height = Math.round(height * MAX_DIM / width);
        width = MAX_DIM;
      } else {
        width = Math.round(width * MAX_DIM / height);
        height = MAX_DIM;
      }
    }
    canvas.width = width;
    canvas.height = height;
    ctx.drawImage(img, 0, 0, width, height);
    
    // Compress to JPEG quality ~0.7, target ~500KB
    let quality = 0.7;
    let dataUrl = canvas.toDataURL('image/jpeg', quality);
    
    // If still > 500KB, reduce quality
    while (dataUrl.length > 500 * 1024 * 4/3 && quality > 0.1) { // base64 is ~4/3 size
      quality -= 0.05;
      dataUrl = canvas.toDataURL('image/jpeg', quality);
    }
    
    // Store base64 (without prefix)
    const base64 = dataUrl.split(',')[1];
    canvas.dataset.base64 = base64;
    
    // Preview toggle
    document.getElementById('fotoPreview').src = dataUrl;
    document.getElementById('preview-container').classList.remove('hidden');
    document.getElementById('upload-placeholder').classList.add('hidden');
  };
  
  img.src = URL.createObjectURL(file);
}

function removeSelectedPhoto(e) {
  if (e) {
    e.stopPropagation();
    e.preventDefault();
  }
  document.getElementById('fotoBukti').value = '';
  const canvas = document.getElementById('compressCanvas');
  canvas.dataset.base64 = '';
  document.getElementById('preview-container').classList.add('hidden');
  document.getElementById('upload-placeholder').classList.remove('hidden');
}

async function handleReportSubmit(e) {
  e.preventDefault();
  
  const btn = e.target.querySelector('button[type=submit]');
  const resultDiv = document.getElementById('form-result');
  btn.disabled = true;
  btn.textContent = 'Mengirim...';
  resultDiv.innerHTML = '';
  
  // Get compressed photo
  const canvas = document.getElementById('compressCanvas');
  const fotoBase64 = canvas.dataset.base64 || '';
  
  const formData = {
    idRelawan: document.getElementById('idRelawan').value.trim(),
    idDesa: document.getElementById('idDesa').value,
    kategoriInfra: document.getElementById('kategoriInfra').value,
    tingkatKerusakan: document.getElementById('tingkatKerusakan').value,
    latitude: document.getElementById('latitude').value,
    longitude: document.getElementById('longitude').value,
    fotoBase64: fotoBase64
  };
  
  try {
    const result = await runServer('processReportSubmit', formData);
    if (result.success) {
      resultDiv.innerHTML = `<div class="p-3 bg-green-900/50 border border-green-700 rounded text-green-300">
        <strong>✅ Laporan terkirim!</strong><br>
        ID: ${result.idLaporan}<br>
        Foto: ${result.fotoUrl ? '<a href="' + result.fotoUrl + '" target="_blank" class="underline">Lihat</a>' : 'Tidak ada'}
      </div>`;
      e.target.reset();
      canvas.dataset.base64 = '';
      document.getElementById('fotoPreview').classList.add('hidden');
      document.getElementById('gps-status').textContent = '';
    } else {
      resultDiv.innerHTML = `<div class="p-3 bg-red-900/50 border border-red-700 rounded text-red-300"><strong>❌ Gagal:</strong> ${result.error}</div>`;
    }
  } catch (err) {
    resultDiv.innerHTML = `<div class="p-3 bg-red-900/50 border border-red-700 rounded text-red-300"><strong>❌ Error:</strong> ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Kirim Laporan';
  }
}

// ---------- ADMIN ----------
function checkAdminSession() {
  if (adminToken) {
    // Validate token by trying to fetch reports
    loadAdminDashboard();
  } else {
    showAdminLogin();
  }
}

function showAdminLogin() {
  document.getElementById('admin-login').classList.remove('hidden');
  document.getElementById('admin-dashboard').classList.add('hidden');
}

function showAdminDashboard() {
  document.getElementById('admin-login').classList.add('hidden');
  document.getElementById('admin-dashboard').classList.remove('hidden');
}

async function handleAdminLogin(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  const errorDiv = document.getElementById('login-error');
  btn.disabled = true;
  btn.textContent = 'Login...';
  errorDiv.textContent = '';
  
  const username = document.getElementById('adminUsername').value;
  const password = document.getElementById('adminPassword').value;
  
  try {
    const result = await runServer('authenticateAdmin', username, password);
    if (result.success) {
      adminToken = result.token;
      adminUser = result.user;
      sessionStorage.setItem('adminToken', adminToken);
      showAdminDashboard();
      loadAdminDashboard();
    } else {
      errorDiv.textContent = result.error || 'Login gagal';
    }
  } catch (err) {
    errorDiv.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login';
  }
}

function adminLogout() {
  adminToken = null;
  adminUser = null;
  sessionStorage.removeItem('adminToken');
  runServer('logoutAdmin', adminToken).catch(() => {});
  showAdminLogin();
  document.getElementById('admin-login-form').reset();
}

async function loadAdminDashboard() {
  if (!adminToken) return showAdminLogin();
  
  document.getElementById('admin-info').textContent = `Logged in as: ${adminUser?.name} (${adminUser?.role})`;
  
  try {
    const result = await runServer('getAllReportsForModeration', adminToken);
    if (!result.success) {
      if (result.error === 'Token tidak valid') {
        adminLogout();
        return;
      }
      throw new Error(result.error);
    }
    renderReportsTable(result.reports || []);
  } catch (err) {
    console.error('loadAdminDashboard error:', err);
  }
}

function renderReportsTable(reports) {
  const tbody = document.getElementById('reports-body');
  tbody.innerHTML = '';
  
  reports.forEach(r => {
    const tr = document.createElement('tr');
    tr.className = 'border-b border-gray-800 hover:bg-gray-900 transition duration-150';
    
    // Status Badge
    let statusBadge = '';
    if (r.Status_Validasi === 'Valid') {
      statusBadge = '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Valid</span>';
    } else if (r.Status_Validasi === 'Ditolak') {
      statusBadge = '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-red-500/10 text-red-400 border border-red-500/20">Ditolak</span>';
    } else {
      statusBadge = '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">Menunggu</span>';
    }
    
    const fotoHtml = r.Foto_Bukti 
      ? `<a href="${r.Foto_Bukti}" target="_blank" class="block hover:scale-105 transition-transform duration-200">
           <img src="${r.Foto_Bukti}" width="48" height="48" class="object-cover rounded-lg border border-gray-800 bg-gray-950 min-w-[48px] min-h-[48px] h-12">
         </a>`
      : '<div class="w-12 h-12 rounded-lg bg-gray-950 flex items-center justify-center border border-gray-800 text-gray-700 text-[10px]">No Photo</div>';
    
    const dateStr = r.Timestamp ? new Date(r.Timestamp).toLocaleDateString('id-ID', {
      day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
    }) : '-';
    
    // Action Buttons
    let actionsHtml = '';
    if (r.Status_Validasi === 'Menunggu') {
      actionsHtml = `
        <div class="flex items-center justify-center gap-1.5">
          <button onclick="adminAction('${r.ID_Laporan}', 'Valid', ${r._rowIndex})" class="px-2.5 py-1 text-xs font-bold bg-emerald-600/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-600 hover:text-white rounded-md transition duration-150">Setujui</button>
          <button onclick="adminAction('${r.ID_Laporan}', 'Ditolak', ${r._rowIndex})" class="px-2.5 py-1 text-xs font-bold bg-red-600/10 text-red-400 border border-red-500/20 hover:bg-red-600 hover:text-white rounded-md transition duration-150">Tolak</button>
        </div>
      `;
    } else {
      actionsHtml = `<span class="text-[10px] text-gray-500">Moderasi oleh ${r.Validator_ID || '-'}</span>`;
    }
    
    tr.innerHTML = `
      <td class="p-4">${fotoHtml}</td>
      <td class="p-4 text-xs text-gray-400">${dateStr}</td>
      <td class="p-4 font-semibold text-gray-200">${r.ID_Desa}</td>
      <td class="p-4 text-gray-300 text-xs">${r.Kategori_Infra}</td>
      <td class="p-4 text-xs">
        <span class="font-medium ${r.Tingkat_Kerusakan === 'Berat' ? 'text-red-400' : r.Tingkat_Kerusakan === 'Sedang' ? 'text-amber-400' : 'text-yellow-200'}">
          ${r.Tingkat_Kerusakan}
        </span>
      </td>
      <td class="p-4 text-[11px] font-mono text-gray-500">${parseFloat(r.Latitude).toFixed(5)}, ${parseFloat(r.Longitude).toFixed(5)}</td>
      <td class="p-4">${statusBadge}</td>
      <td class="p-4 text-center">${actionsHtml}</td>
    `;
    tbody.appendChild(tr);
  });
}

async function adminAction(idLaporan, newStatus, rowIndex) {
  if (!adminToken) return adminLogout();
  
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '...';
  
  try {
    const result = await runServer('updateValidationStatus', adminToken, idLaporan, newStatus);
    if (result.success) {
      // Update row visually
      loadAdminDashboard();
    } else {
      alert('Gagal: ' + result.error);
      btn.disabled = false;
      btn.textContent = newStatus === 'Valid' ? 'Setujui' : 'Tolak';
    }
  } catch (err) {
    alert('Error: ' + err.message);
    btn.disabled = false;
    btn.textContent = newStatus === 'Valid' ? 'Setujui' : 'Tolak';
  }
}

// ---------- AUTO REFRESH CHOROPLETH ----------
setInterval(() => {
  if (!document.getElementById('page-map').classList.contains('hidden') && map) {
    loadChoroplethData();
  }
}, 60000); // 1 menit refresh UI

  </script>
